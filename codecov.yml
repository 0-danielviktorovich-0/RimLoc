# RimLoc Codecov policy: informational baseline during pre-beta; see .github/CODECOV.md.
codecov:
  # Coverage is intentionally informational during the pre-beta baseline period.
  # The coverage workflow itself runs tests before upload, so Codecov does not
  # need to wait for every unrelated CI job before processing a report.
  require_ci_to_pass: false
  max_report_age: "24h"
  # Two independent uploads (generic Rust + desktop Rust) make up one commit.
  # Wait for both before emitting final Codecov notifications/comments.
  notify:
    after_n_builds: 2

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        only_pulls: true
    patch:
      default:
        target: auto
        threshold: 0%
        informational: true
        only_pulls: true

# Components are the primary subsystem view. They slice the same coverage
# reports by source path, so we do not rerun the Rust test suite per crate.
# This follows Codecov's recommendation for new monorepo-style projects:
# components for product areas, flags for independently uploaded test families.
component_management:
  individual_components:
    - component_id: domain
      name: Domain model
      paths:
        - "crates/rimloc-domain/src/**"
    - component_id: core
      name: Core localization logic
      paths:
        - "crates/rimloc-core/src/**"
    - component_id: services
      name: Services / orchestration
      paths:
        - "crates/rimloc-services/src/**"
    - component_id: parsers_xml
      name: RimWorld XML parsing
      paths:
        - "crates/rimloc-parsers-xml/src/**"
    - component_id: validation
      name: Validation
      paths:
        - "crates/rimloc-validate/src/**"
    - component_id: cli
      name: CLI
      paths:
        - "crates/rimloc-cli/src/**"
    - component_id: formats
      name: Import / export formats
      paths:
        - "crates/rimloc-export-csv/src/**"
        - "crates/rimloc-export-po/src/**"
        - "crates/rimloc-export-xliff/src/**"
        - "crates/rimloc-import-po/src/**"
        - "crates/rimloc-import-xliff/src/**"
    - component_id: llm
      name: LLM / provider layer
      paths:
        - "crates/rimloc-llm/src/**"
    - component_id: config
      name: Configuration
      paths:
        - "crates/rimloc-config/src/**"
    - component_id: plugins
      name: Legacy scan plugin compatibility
      paths:
        - "crates/rimloc-plugin-api/src/**"
        - "crates/rimloc-plugin-jsonftl/src/**"
    - component_id: desktop_rust
      name: Desktop Rust / Tauri
      paths:
        - "gui/tauri-app/src-tauri/src/**"

# Flags represent independently uploaded test families. Both are uploaded on
# every relevant run, so carryforward is deliberately false: stale coverage
# must never masquerade as a fresh test run.
flags:
  rust:
    paths:
      - "crates/**"
    carryforward: false
  gui-rust:
    paths:
      - "gui/tauri-app/src-tauri/src/**"
    carryforward: false

comment:
  layout: "condensed_header, diff, flags, components, condensed_files, condensed_footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

# GitHub line annotations are being deprecated by Codecov and also conflict
# with Flags/Components. Keep Codecov statuses/comments and use Codecov's file
# view/browser extension for line-level exploration.
github_checks:
  annotations: false

# Coverage measures production/source code, not fixtures, docs, generated output,
# vendored dependencies, test bodies, or the frozen UI fallback.
ignore:
  - "gui/tauri-app/frontend-react"
  - "gui/tauri-app/src-tauri/vendor/**"
  - "gui/tauri-app/src-tauri/gen/**"
  - "gui/tauri-app/frontend-v2/**"
  - "gui/tauri-app/frontend/**"
  - "crates/**/tests/**"
  - "crates/**/benches/**"
  - "crates/**/examples/**"
  - "**/build.rs"
  - "test/**"
  - "testlab/**"
  - "docs/**"
  - "site/**"

