codecov:
  require_ci_to_pass: true
  max_report_age: "12h"

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        only_pulls: true
    patch:
      default:
        target: auto
        threshold: 0%
        informational: true
        only_pulls: true

# Components give useful per-subsystem visibility from the same uploaded report
# without re-running the full Rust suite for every crate.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
        informational: true
        only_pulls: true
      - type: patch
        target: auto
        threshold: 0%
        informational: true
        only_pulls: true
  individual_components:
    - component_id: domain_core
      name: Domain & Core
      paths:
        - "crates/rimloc-domain/**"
        - "crates/rimloc-core/**"
    - component_id: services
      name: Services
      paths:
        - "crates/rimloc-services/**"
    - component_id: rimworld_semantics
      name: RimWorld parsers & validation
      paths:
        - "crates/rimloc-parsers-xml/**"
        - "crates/rimloc-validate/**"
    - component_id: formats
      name: Import / Export formats
      paths:
        - "crates/rimloc-export-csv/**"
        - "crates/rimloc-export-po/**"
        - "crates/rimloc-export-xliff/**"
        - "crates/rimloc-import-po/**"
        - "crates/rimloc-import-xliff/**"
    - component_id: cli
      name: CLI
      paths:
        - "crates/rimloc-cli/**"
    - component_id: providers_config
      name: Providers & Config
      paths:
        - "crates/rimloc-llm/**"
        - "crates/rimloc-config/**"
    - component_id: plugins
      name: Plugin compatibility layer
      paths:
        - "crates/rimloc-plugin-api/**"
        - "crates/rimloc-plugin-jsonftl/**"
    - component_id: desktop_rust
      name: Desktop Rust / Tauri
      paths:
        - "gui/tauri-app/src-tauri/src/**"

# Flags identify independently uploaded test families. Components above then
# slice those reports by product subsystem.
flags:
  rust:
    paths:
      - "crates/**"
    carryforward: false
  gui-rust:
    paths:
      - "gui/tauri-app/src-tauri/src/**"
    carryforward: false

comment:
  layout: "condensed_header, diff, flags, components, condensed_files, condensed_footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

# Codecov has announced GitHub line annotations as deprecated, and they conflict
# with Components/Flags. Keep GitHub Checks/statuses, but use the PR comment and
# Codecov UI for line-level exploration.
github_checks:
  annotations: false

ignore:
  - "gui/tauri-app/src-tauri/vendor"
  - "gui/tauri-app/frontend-v2"
  - "gui/tauri-app/frontend"
  - "test"
  - "testlab"
  - "docs"
  - "site"
