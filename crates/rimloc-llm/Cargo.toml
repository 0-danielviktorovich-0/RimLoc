[package]
name = "rimloc-llm"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "LLM translation subsystem for RimLoc: providers, batching, glossary, checkpoints, validation"

[dependencies]
rimloc-core = { path = "../rimloc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query"], optional = true }
# keyring 3 has NO default platform backend: without explicit features
# `Entry::new` silently resolves to the in-memory MOCK store. The explicit
# triple turns on the real OS stores — macOS Keychain (apple-native) and
# Windows Credential Manager (windows-native). Linux Secret Service
# (`sync-secret-service`) is deliberately NOT enabled: it needs libdbus at
# build time; flip it on when Linux packaging is in scope.
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native", "windows-native"] }

[features]
default = ["http"]
http = ["dep:reqwest"]
keychain = ["dep:keyring"]

[dev-dependencies]
tempfile = { workspace = true }
