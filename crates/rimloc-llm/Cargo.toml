[package]
name = "rimloc-llm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "LLM translation subsystem for RimLoc: providers, batching, glossary, checkpoints, validation"

[dependencies]
rimloc-core = { path = "../rimloc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query"], optional = true }
keyring = { version = "3", optional = true }

[features]
default = ["http"]
http = ["dep:reqwest"]
keychain = ["dep:keyring"]

[dev-dependencies]
tempfile = { workspace = true }
