[package]
name = "rimloc-services"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"

[dependencies]
color-eyre = { workspace = true }
rimloc-core = { version = "0.1.0", path = "../rimloc-core" }
rimloc-parsers-xml = { version = "0.1.0", path = "../rimloc-parsers-xml" }
rimloc-validate = { version = "0.1.0", path = "../rimloc-validate" }
rimloc-export-po = { version = "0.1.0", path = "../rimloc-export-po" }
rimloc-import-po = { version = "0.1.0", path = "../rimloc-import-po" }
rimloc-domain = { version = "0.1.0", path = "../rimloc-domain" }
rimloc-llm = { version = "0.1.0", path = "../rimloc-llm", default-features = false }
rimloc-plugin-api = { version = "0.1.0", path = "../rimloc-plugin-api" }
rimloc-config = { version = "0.1.0", path = "../rimloc-config" }
regex = "1"
quick-xml = { workspace = true }
walkdir = { workspace = true }
once_cell = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query"] }
lru = "0.18"
urlencoding = "2.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
schemars = { workspace = true }
roxmltree = { workspace = true }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { workspace = true }
libloading = { version = "0.9" }
serde_yaml = "0.9"

[features]
default = []
# OS-keychain persistence for provider API keys (keyring v3 via rimloc-llm).
# Opt-in: CLI/library builds without it refuse secret-bearing provider
# upserts honestly (unsupported_capability) instead of storing plaintext.
keychain = ["rimloc-llm/keychain"]

[dev-dependencies]
tempfile = { workspace = true }
