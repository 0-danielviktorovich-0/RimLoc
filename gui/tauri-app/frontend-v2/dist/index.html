    <script>
      // Apply persisted theme before first paint to avoid a light flash.
      // Mirrors the triad from GUI_DESIGN_SPEC §1.1; dark is the default reference theme.
      (function () {
        var mode = 'dark';
        try {
          var saved = localStorage.getItem('rimloc.theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') mode = saved;
        } catch (e) { /* storage unavailable */ }
        if (mode === 'system') {
          var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          mode = light ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = mode;
      })();
      // Apply persisted style-lab axes before first paint (same anti-flash rule).
      // Defaults equal the shipped baseline, so production is unaffected.
      (function () {
        var allowed = {
          style: ['precision', 'aurora', 'workshop', 'editorial'],
          palette: ['indigo', 'blue', 'emerald', 'amber'],
          density: ['comfortable', 'compact']
        };
        var defaults = { style: 'precision', palette: 'indigo', density: 'comfortable' };
        var el = document.documentElement;
        for (var axis in allowed) {
          var v = defaults[axis];
          try {
            var saved = localStorage.getItem('rimloc.style.' + axis);
            if (saved && allowed[axis].indexOf(saved) !== -1) v = saved;
          } catch (e) { /* storage unavailable */ }
          el.dataset[axis] = v;
        }
      })();
    </script>
