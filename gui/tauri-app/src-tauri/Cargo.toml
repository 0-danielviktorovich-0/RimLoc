[package]
name = "rimloc-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }
image = "0.25"
ico = "0.3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-dialog = "2"
open = "5"
thiserror = "1"
rimloc-services = { path = "../../../crates/rimloc-services" }
rimloc-domain = { path = "../../../crates/rimloc-domain" }
rimloc-import-po = { path = "../../../crates/rimloc-import-po" }
rimloc-export-csv = { path = "../../../crates/rimloc-export-csv" }
rimloc-parsers-xml = { path = "../../../crates/rimloc-parsers-xml" }
rimloc-export-po = { path = "../../../crates/rimloc-export-po" }
rimloc-export-xliff = { path = "../../../crates/rimloc-export-xliff" }
rimloc-import-xliff = { path = "../../../crates/rimloc-import-xliff" }
roxmltree = "0.21"
schemars = "1"
color-eyre = "0.6"
walkdir = "2"
dirs = "7"
once_cell = "1"
regex = "1"
tauri-plugin-wdio-webdriver = "1.4.0"
tauri-plugin-wdio = "1.4.0"
tauri-plugin-window-state = "=2.0.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "rimloc_gui_lib"
path = "src/lib.rs"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

 
