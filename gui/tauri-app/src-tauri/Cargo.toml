[package]
name = "rimloc-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }
image = "0.25"
ico = "0.3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-dialog = "2"
open = "5"
thiserror = "1"
rimloc-services = { path = "../../../crates/rimloc-services" }
rimloc-domain = { path = "../../../crates/rimloc-domain" }
rimloc-import-po = { path = "../../../crates/rimloc-import-po" }
rimloc-export-csv = { path = "../../../crates/rimloc-export-csv" }
rimloc-parsers-xml = { path = "../../../crates/rimloc-parsers-xml" }
rimloc-export-po = { path = "../../../crates/rimloc-export-po" }
rimloc-export-xliff = { path = "../../../crates/rimloc-export-xliff" }
rimloc-import-xliff = { path = "../../../crates/rimloc-import-xliff" }
roxmltree = "0.21"
schemars = "1"
color-eyre = "0.6"
walkdir = "2"
dirs = "7"
once_cell = "1"
regex = "1"
tauri-plugin-wdio-webdriver = { optional = true, version = "1.4.0" }
tauri-plugin-wdio = { optional = true, version = "1.4.0" }
tauri-plugin-window-state = "=2.0.0"

[features]
default = ["custom-protocol", "keychain"]
custom-protocol = ["tauri/custom-protocol"]
# Provider-instance secret persistence (provider/settings parity): the
# shell attaches the OS-keychain sink to the session manager. Building with
# --no-default-features drops it — the services layer then refuses
# secret-bearing provider upserts honestly instead of storing plaintext.
keychain = ["rimloc-services/keychain"]
# P0 security boundary (owner 2026-10-01, §B): the embedded WDIO bridge is
# a compile-time opt-in. Production builds never link it; the automation
# artifact builds with --features automation-bridge. The runtime env
# (RIMLOC_AUTOMATION=1) stays as defense in depth, never as the gate.
automation-bridge = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]

[lib]
name = "rimloc_gui_lib"
path = "src/lib.rs"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

 
