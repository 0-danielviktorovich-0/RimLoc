[workspace]
resolver = "2"
members = [
    "crates/rimloc-core",
    "crates/rimloc-plugin-api",
    "crates/rimloc-plugin-jsonftl",
    "crates/rimloc-parsers-xml",
    "crates/rimloc-export-csv",
    "crates/rimloc-export-po",
    "crates/rimloc-cli",
    "crates/rimloc-validate",
    "crates/rimloc-import-po",
    "crates/rimloc-llm",
    "crates/rimloc-services",
    "crates/rimloc-domain",
    "crates/rimloc-config",
    "crates/rimloc-export-xliff",
    "crates/rimloc-import-xliff",
    "gui/tauri-app/src-tauri",
]
# Patched upstream crates are dependencies, not RimLoc workspace packages.
# Keeping them explicitly excluded lets Cargo/CodeQL load their manifests
# independently without attributing upstream sources to the RimLoc workspace.
exclude = [
    "gui/tauri-app/vendor/wry-0.57.0-noactivate",
    "gui/tauri-app/vendor/tao-0.37.1-noactivate",
    "gui/tauri-app/vendor/tauri-utils-2.10.1-nfs-appledouble",
]


[workspace.package]
edition = "2021"
license = "GNU GPL"
authors = ["Daniel Viktorovich"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
roxmltree = "0.21" # удобный read-only XML парсер
quick-xml = "0.42" # оставим для будущего потокового парсинга
csv = "1"
clap = { version = "4", features = ["derive"] }
color-eyre = { version = "0.6", features = ["capture-spantrace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
once_cell = "1"
regex = "1"
schemars = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
zip = "8"
tempfile = "3"

# Note: a patched `glib` was previously applied at the workspace level
# to work around a Linux-only issue in WebKitGTK builds. On macOS/Windows
# the GTK stack is not in the dependency graph, which triggered Cargo
# warnings about an unused patch. The patch is removed from the workspace
# to avoid noise. If you need the patch for Linux packaging, add it
# temporarily via `--config` or a target-specific workflow.

# P0 zero-focus-stealing (owner 2026-10-01): vendored wry without the
# unconditional NSApplication::activate() at webview creation — the only
# path to truly background launches. Upstream PR pending.
# DMG-stage lane (2026-10-07): vendored tauri-utils that skips macOS
# AppleDouble ("._*") files in the ACL permission glob. On the NFS-mounted
# Portable-SSD the kernel backs xattrs with real "._" sibling files, and
# tauri's build script panicked on "._default.toml"
# (tauri-2.12.1/build.rs:424, "stream did not contain valid UTF-8") —
# see docs/development/RELEASE_GATE.md.
[patch.crates-io]
wry = { path = "gui/tauri-app/vendor/wry-0.57.0-noactivate" }
tao = { path = "gui/tauri-app/vendor/tao-0.37.1-noactivate" }
tauri-utils = { path = "gui/tauri-app/vendor/tauri-utils-2.10.1-nfs-appledouble" }
