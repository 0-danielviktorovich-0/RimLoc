[workspace]
resolver = "2"
members = [
    "crates/rimloc-core",
    "crates/rimloc-plugin-api",
    "crates/rimloc-plugin-jsonftl",
    "crates/rimloc-parsers-xml",
    "crates/rimloc-export-csv",
    "crates/rimloc-export-po",
    "crates/rimloc-cli",
    "crates/rimloc-validate",
    "crates/rimloc-import-po",
    "crates/rimloc-llm",
    "crates/rimloc-services",
    "crates/rimloc-domain",
    "crates/rimloc-config",
    "crates/rimloc-export-xliff",
    "crates/rimloc-import-xliff",
    "gui/tauri-app/src-tauri",
]


[workspace.package]
edition = "2021"
license = "GNU GPL"
authors = ["Daniel Viktorovich"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
roxmltree = "0.21" # удобный read-only XML парсер
quick-xml = "0.42" # оставим для будущего потокового парсинга
csv = "1"
clap = { version = "4", features = ["derive"] }
color-eyre = { version = "0.6", features = ["capture-spantrace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
once_cell = "1"
regex = "1"
schemars = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
zip = "8"
tempfile = "3"

# Note: a patched `glib` was previously applied at the workspace level
# to work around a Linux-only issue in WebKitGTK builds. On macOS/Windows
# the GTK stack is not in the dependency graph, which triggered Cargo
# warnings about an unused patch. The patch is removed from the workspace
# to avoid noise. If you need the patch for Linux packaging, add it
# temporarily via `--config` or a target-specific workflow.

# P0 zero-focus-stealing (owner 2026-10-01): vendored wry without the
# unconditional NSApplication::activate() at webview creation — the only
# path to truly background launches. Upstream PR pending.
[patch.crates-io]
wry = { path = "gui/tauri-app/vendor/wry-0.55.1-noactivate" }
tao = { path = "gui/tauri-app/vendor/tao-0.35.3-noactivate" }
