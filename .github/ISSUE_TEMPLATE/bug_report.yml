name: Bug Report
description: Report a problem with RimLoc desktop, CLI, or shared localization engine
labels: [bug]
body:
  - type: checkboxes
    id: dupcheck
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for duplicates
          required: true
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop (React R1)
        - Desktop (legacy/fallback)
        - CLI
        - RimWorld scanning / adapter
        - Build / export / import
        - Validation
        - Translation Memory / glossary
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: RimLoc build / version
      description: Version, commit SHA, branch, or artifact identity
      placeholder: feature/ui-r1-convergence @ abc1234
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact UI steps or CLI command. Remove private path fragments where possible.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Error text and screenshots are useful
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      description: A tiny sanitized mod/project/fixture if possible
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / diagnostics
      description: Review and redact secrets or personal data before posting. A sanitized RimLoc diagnostics bundle is preferred when available.
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, tokens, private paths, and other sensitive data from public attachments
          required: true
