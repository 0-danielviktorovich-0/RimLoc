name: Feature Request
description: Suggest a user workflow, adapter, or product improvement for RimLoc
labels: [enhancement]
body:
  - type: checkboxes
    id: dupcheck
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues/PRs for duplicates
          required: true
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / workflow
      description: What are you trying to do, and what is painful or impossible today?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - RimWorld translation workflow
        - Desktop UI / UX
        - CLI / automation
        - Translation Memory / glossary
        - Validation / review
        - Import / export format
        - New game/application adapter
        - AI / provider workflow
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested outcome
      description: Describe the result you want. Implementation details are optional.
    validations:
      required: true

  - type: textarea
    id: adapter
    attributes:
      label: If this is a new adapter
      description: Game/app, source formats, existing translations, build/export format, and any version/dependency rules.
    validations:
      required: false

  - type: textarea
    id: priorart
    attributes:
      label: Prior art / examples
      description: Other localization tools or workflows that solve this well.
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: How should we know it works?
      description: Real example/project, expected result, or acceptance scenario.
    validations:
      required: false

  - type: input
    id: related
    attributes:
      label: Related issues/PRs
      placeholder: https://github.com/0-danielviktorovich-0/RimLoc/issues/123
    validations:
      required: false
