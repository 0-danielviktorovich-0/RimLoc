name: RimLoc CodeQL Config

queries:
  - uses: security-extended

paths:
  - crates/**
  - gui/tauri-app/frontend-react/**
  - gui/tauri-app/frontend-v2/**
  - gui/tauri-app/src-tauri/src/**
  - gui/tauri-app/src-tauri/build.rs
  - scripts/**

paths-ignore:
  - gui/tauri-app/vendor/**
  - gui/tauri-app/src-tauri/vendor/**
  - "**/node_modules/**"
  - "**/target/**"
  - test/**
  - testlab/**
  - docs/**
  - site/**
  - "**/*.md"
  - "**/*.png"
  - "**/*.ico"
  - "**/*.svg"
