# CodeQL — controlled Advanced Setup (C5, 2026-10-07).
#
# Почему advanced, а не default setup: `tauri::generate_context!()` в
# gui/tauri-app/src-tauri/src/lib.rs раскрывается только при наличии
# gui/tauri-app/frontend-v2/dist, а dist gitignored (сборочный артефакт).
# Автономная сборка default setup этот контекст не создаёт — extraction давал
# стабильный `1 Rust file extracted with error` при 297 чистых файлах, и
# GitHub показывал banner `Code scanning configuration error`.
#
# Контролируемая последовательность: собрать dist ДО init/autobuild, дать
# autobuild скомпилировать workspace (включая gui-крейт с gtk-депами), затем
# analyze. Конфиг запросов — .github/codeql/codeql-config.yml (security-extended,
# paths/paths-ignore без изменений).
#
# Правила файла — см. docs/development/CI.md §5: actions запинены на полные SHA,
# permissions минимальны per-job, обязательные шаги без `|| true`.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (rust, js/ts, actions, python)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-27)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6 (pinned 2026-09-27)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/tauri-app/frontend-v2/package-lock.json

      # Frontend prerequisite: tauri::generate_context! reads frontend-v2/dist.
      - name: Build frontend-v2 dist (tauri context prerequisite)
        run: |
          cd gui/tauri-app/frontend-v2
          npm ci
          npm run build

      # gtk-депы: gui-крейт компилируется только с ними (тот же набор, что в ci.yml gui-джобе).
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2 (pinned 2026-10-07)
        with:
          languages: rust, javascript-typescript, actions, python
          config-file: .github/codeql/codeql-config.yml
          build-mode: manual

      # Rust-экстракция идёт из реальной компиляции: workspace целиком, включая gui.
      - name: Manual build for Rust extraction
        run: cargo build --workspace --all-features

      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2 (pinned 2026-10-07)
        with:
          upload: true
