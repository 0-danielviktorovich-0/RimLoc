name: Public history hygiene

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: public Git metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use the trusted base branch. Pull-request code is never executed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-27)
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch pull request history without executing pull request code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/public-history-pr-${PR_NUMBER}"

      - name: Checker self-test
        run: python3 scripts/check-public-git-language.py --self-test

      - name: Validate pull request title
        env:
          PUBLIC_TEXT: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-public-git-language.py --surface pr --text "$PUBLIC_TEXT"

      - name: Validate public branch name
        env:
          PUBLIC_TEXT: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/check-public-git-language.py --surface branch --text "$PUBLIC_TEXT"

      - name: Validate new commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/check-public-git-language.py --surface commit-range --base "$BASE_SHA" --head "refs/remotes/origin/public-history-pr-${PR_NUMBER}"

      - name: Validate new changelog text
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/check-public-git-language.py --surface changelog-diff --base "$BASE_SHA" --head "refs/remotes/origin/public-history-pr-${PR_NUMBER}"
