# API stability: semver-проверки (гейт) + публичный API-диф (информационный).
# Информационный job public-api перенесён сюда из public-api.yml (удалён) —
# это один сюжет. Дизайн — docs/development/CI.md.
#
# Правила: actions запинены на полные SHA; permissions по job'ам; без `|| true`
# на обязательных шагах (упавший инструмент = красный PR, молчаливой деградации нет).
name: API stability

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: api-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    name: cargo-semver-checks (gating)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-27)
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned 2026-09-27)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (pinned 2026-09-27)
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Run semver checks for published crates
        run: |
          set -euo pipefail
          crates=(
            rimloc-core
            rimloc-parsers-xml
            rimloc-export-csv
            rimloc-export-po
            rimloc-import-po
            rimloc-validate
          )
          for c in "${crates[@]}"; do
            echo "Checking crate: $c"
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$c" || echo 000)
            if [[ "$code" != "200" ]]; then
              echo "- Skipping $c (not published on crates.io)"
              continue
            fi
            cargo semver-checks check-release -p "$c"
          done

  public-api:
    name: public-api diff (informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-27)
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned 2026-09-27)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (pinned 2026-09-27)
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked
      # Человекочитаемый диф публичного API к published-крейтам. Job'у разрешено
      # показывать диф и падать только на реальной ошибке инструмента: сам диф
      # `--diff-git-branch` завершается с кодом 0, так что красный здесь = «не
      # смогли проверить», а не «API изменился» (изменения ловит semver job выше).
      - name: Show public API diffs vs origin/main
        run: |
          set -euo pipefail
          CRATES=(
            rimloc-core
            rimloc-parsers-xml
            rimloc-export-csv
            rimloc-export-po
            rimloc-import-po
            rimloc-validate
          )
          for c in "${CRATES[@]}"; do
            echo "=== $c ==="
            cargo public-api -p "$c" --diff-git-branch origin/main
            echo
          done
