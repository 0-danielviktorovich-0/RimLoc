# Версионирование и публикация релизов — единственный автоматический владелец
# crates.io-публикации в репозитории (publish.yml — только ручной recovery).
#
# С push-триггерами, снятыми по решению владельца (b102f3e), процесс двухшаговый
# и полностью ручной, оба шага — dispatch этого workflow на main:
#   1. Dispatch -> job release_pr: создать/обновить Release PR (версии + changelog).
#   2. Смержить Release PR, затем ещё один Dispatch -> job release:
#      проставить тег и опубликовать крейсы в crates.io.
# Раньше release_pr срабатывал и на pull_request — там он считал диф не от
# main и создавал шум на каждом PR; триггер убран. Подробности — CI.md §3.
name: Release-plz

on:
  workflow_dispatch:

permissions: {}

jobs:
  release_pr:
    name: Create/Update Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-27)
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned 2026-09-27)
      - name: release-plz (release-pr with PAT)
        if: env.RELEASE_PLZ_TOKEN != ''
        uses: MarcoIeni/release-plz-action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5 (pinned 2026-09-27)
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: release-plz (release-pr)
        if: env.RELEASE_PLZ_TOKEN == ''
        uses: MarcoIeni/release-plz-action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5 (pinned 2026-09-27)
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Tag + Publish Release
    runs-on: ubuntu-latest
    needs: release_pr
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: release-plz-release-${{ github.ref }}
      # Публикацию не отменяем на полпути: теги и crates.io — необратимые
      # действия, отменённый запуск оставляет полупубликованную пачку.
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-27)
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned 2026-09-27)
      - name: release-plz (release with PAT)
        if: env.CARGO_REGISTRY_TOKEN != '' && env.RELEASE_PLZ_TOKEN != ''
        uses: MarcoIeni/release-plz-action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5 (pinned 2026-09-27)
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: release-plz (release)
        if: env.CARGO_REGISTRY_TOKEN != '' && env.RELEASE_PLZ_TOKEN == ''
        uses: MarcoIeni/release-plz-action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5 (pinned 2026-09-27)
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
