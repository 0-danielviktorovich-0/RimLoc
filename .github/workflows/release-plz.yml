# Controlled release-plz entrypoint.
# Release PR creation and irreversible tag/publish are separate manual modes.
# A single dispatch must never create a release PR and then publish/tag in the same run.
name: Release-plz

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation to run"
        required: true
        type: choice
        default: release-pr
        options:
          - release-pr
          - release

permissions: {}

jobs:
  release_pr:
    name: Create/Update Release PR
    if: github.ref == 'refs/heads/main' && inputs.mode == 'release-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-27)
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned 2026-09-27)
      - name: release-plz (release-pr with PAT)
        if: env.RELEASE_PLZ_TOKEN != ''
        uses: MarcoIeni/release-plz-action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5 (pinned 2026-09-27)
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: release-plz (release-pr with GITHUB_TOKEN)
        if: env.RELEASE_PLZ_TOKEN == ''
        uses: MarcoIeni/release-plz-action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5 (pinned 2026-09-27)
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Tag + Publish Release
    if: github.ref == 'refs/heads/main' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-27)
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned 2026-09-27)
      - name: Refuse release without crates.io token
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo "CARGO_REGISTRY_TOKEN is required for release mode." >&2
          exit 1
      - name: release-plz (release with PAT)
        if: env.CARGO_REGISTRY_TOKEN != '' && env.RELEASE_PLZ_TOKEN != ''
        uses: MarcoIeni/release-plz-action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5 (pinned 2026-09-27)
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: release-plz (release with GITHUB_TOKEN)
        if: env.CARGO_REGISTRY_TOKEN != '' && env.RELEASE_PLZ_TOKEN == ''
        uses: MarcoIeni/release-plz-action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5 (pinned 2026-09-27)
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
